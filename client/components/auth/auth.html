<main id="auth-container" class="card auth-card">
  <div class="auth-tabs">
    <button id="tab-login" class="auth-tab active">Đăng nhập</button>
    <button id="tab-register" class="auth-tab">Đăng ký</button>
  </div>

  <!-- Form đăng nhập -->
  <form id="login-form" class="auth-form">
    <h2>Đăng nhập</h2>
    <p class="subtitle">Chào mừng trở lại! Vui lòng đăng nhập để tiếp tục.</p>
    
    <div class="form-group">
      <label for="login-username">Tên đăng nhập</label>
      <input id="login-username" type="text" placeholder="Nhập tên đăng nhập" required />
    </div>
    
    <div class="form-group">
      <label for="login-password">Mật khẩu</label>
      <input id="login-password" type="password" placeholder="Nhập mật khẩu" required />
    </div>
    
    <div id="login-error" class="error-message"></div>
    
    <button type="submit" class="primary-btn">Đăng nhập</button>
  </form>

  <!-- Form đăng ký -->
  <form id="register-form" class="auth-form" style="display:none;">
    <h2>Đăng ký tài khoản</h2>
    <p class="subtitle">Tạo tài khoản mới để sử dụng dịch vụ.</p>
    
    <div class="form-group">
      <label for="register-username">Tên đăng nhập</label>
      <input id="register-username" type="text" placeholder="Tối thiểu 3 ký tự" required />
    </div>
    
    <div class="form-group">
      <label for="register-email">Email</label>
      <input id="register-email" type="email" placeholder="example@email.com" required />
    </div>
    
    <div class="form-group">
      <label for="register-password">Mật khẩu</label>
      <input id="register-password" type="password" placeholder="Tối thiểu 6 ký tự" required />
    </div>
    
    <div class="form-group">
      <label for="register-confirm-password">Xác nhận mật khẩu</label>
      <input id="register-confirm-password" type="password" placeholder="Nhập lại mật khẩu" required />
    </div>
    
    <div id="register-error" class="error-message"></div>
    
    <button type="submit" class="primary-btn">Đăng ký</button>
  </form>
</main>
