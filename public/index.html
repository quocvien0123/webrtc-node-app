<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VN Meet – Video Conference</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="includes.js" defer></script>
</head>

<body>
  <div class="app-shell">
    <!-- Header -->
    <div data-include="partials/header.html"></div>

    <!-- Container đăng nhập/đăng ký -->
    <!-- Auth -->
    <div data-include="partials/auth.html"></div>

    <!-- Container chọn phòng -->
    <!-- Room Selection -->
    <div data-include="partials/room-selection.html"></div>

    <!-- Container video conference -->
    <!-- Video Chat -->
    <div data-include="partials/video-chat.html"></div>
  </div>

  <!-- Socket.io + client.js -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>

  <!-- Kích hoạt Lucide icons sau khi include xong -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.__includesReady) {
        window.__includesReady.then(() => {
          lucide.createIcons();
        });
      } else {
        lucide.createIcons();
      }
    });
  </script>
</body>

</html>
