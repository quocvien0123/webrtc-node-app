<main id="video-chat-container" class="video-layout" style="display:none;">
  <section class="video-area card">
    <!-- Video grid cho nhiều người -->
    <div id="videos-container" class="videos-container">
      <!-- Local video -->
      <div class="video-tile" id="local-tile">
        <span class="video-label">Bạn</span>
        <video id="local-video" autoplay muted playsinline></video>
      </div>
      <!-- Remote videos sẽ được thêm động -->
    </div>

    <!-- Bottom control bar -->
    <div class="bottom-bar">
      <div class="control-buttons">
        <button class="btn" id="mic-button" title="Bật / tắt micro">
          <i data-lucide="mic"></i>
        </button>
        <button class="btn" id="cam-button" title="Bật / tắt camera">
          <i data-lucide="camera"></i>
        </button>
        <button class="btn" id="share-screen-button" title="Chia sẻ màn hình">
          <i data-lucide="screen-share"></i>
        </button>
        <button class="btn" id="stop-share-button" title="Dừng chia sẻ màn hình" style="display:none;">
          <i data-lucide="screen-share-off"></i>
        </button>
        <button class="btn" id="record-button" title="Ghi lại cuộc gọi">
          <i data-lucide="circle"></i>
        </button>
        <button class="btn" id="stop-record-button" title="Dừng ghi" style="display:none;">
          <i data-lucide="square"></i>
        </button>
        <button class="btn" id="reactions-button" title="Thả cảm xúc">
          <i data-lucide="smile"></i>
        </button>
        <button class="btn hangup" id="leave-button" title="Rời cuộc gọi">
          <i data-lucide="phone-off"></i>
        </button>
      </div>
    </div>
    <!-- Reactions layer and popover -->
    <div id="reactions-layer" class="reactions-layer"></div>
    <div id="reactions-popover" class="reactions-popover" style="display:none;">
      <button class="rxn">👍</button>
      <button class="rxn">❤️</button>
      <button class="rxn">😂</button>
      <button class="rxn">😮</button>
      <button class="rxn">👏</button>
      <button class="rxn">🎉</button>
    </div>
  </section>

  <!-- Chat modal trigger (floating button) -->
  <button id="chat-toggle" class="chat-fab" title="Chat" style="display:none;">
    <i data-lucide="message-circle"></i>
  </button>

  <!-- Chat modal + overlay -->
  <div id="chat-overlay" class="modal-overlay" style="display:none;"></div>
  <section id="chat-modal" class="chat-modal card" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="chat-modal-title">
    <div class="chat-modal-header">
      <h3 id="chat-modal-title">Chat</h3>
      <button id="chat-close" class="icon-btn" aria-label="Đóng">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="chat-modal-body">
      <!-- Chat mode selector -->
      <div class="chat-mode-selector">
        <label>Gửi tới:</label>
        <div class="chat-mode-tabs">
          <button class="chat-mode-tab active" data-mode="all">Tất cả</button>
          <button class="chat-mode-tab" data-mode="private">Riêng tư</button>
          <button class="chat-mode-tab" data-mode="group">Nhóm</button>
        </div>
      </div>
      
      <!-- Private recipient selector -->
      <div class="chat-recipient-row" id="private-selector" style="display:none;">
        <label for="private-target">Gửi cho:</label>
        <select id="private-target" class="chat-select">
          <option value="">-- Chọn người --</option>
        </select>
      </div>
      
      <!-- Group selector & management -->
      <div class="chat-recipient-row" id="group-selector" style="display:none;">
        <label for="group-target">Nhóm:</label>
        <select id="group-target" class="chat-select">
          <option value="">-- Chọn nhóm --</option>
        </select>
        <button id="group-manage-btn" class="icon-btn" title="Quản lý nhóm">
          <i data-lucide="settings"></i>
        </button>
      </div>
      
      <!-- Group management panel (hidden by default) -->
      <div class="group-manage-panel" id="group-manage-panel" style="display:none;">
        <div class="group-manage-header">
          <span>Quản lý nhóm</span>
          <button id="group-manage-close" class="icon-btn-sm">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="group-manage-body">
          <div class="group-create-row">
            <input id="group-name-input" type="text" placeholder="Tên nhóm mới..." maxlength="32" />
            <button id="group-create-btn" class="primary-btn-sm">Tạo</button>
          </div>

          <div class="group-add-row">
            <select id="group-add-user" class="chat-select">
              <option value="">-- Chọn người để thêm --</option>
            </select>
            <button id="group-add-btn" class="primary-btn-sm">Thêm</button>
          </div>
          <div class="group-list">
            <label>Nhóm của bạn:</label>
            <ul id="joined-groups-list"></ul>
          </div>
        </div>
      </div>
      
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" placeholder="Nhắn tin..." />
        <button id="chat-send" class="primary-btn">Gửi</button>
      </div>
    </div>
  </section>
</main>
